<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>OS de Vie</title>

<!-- Tailwind CSS pour le design -->

<script src="https://cdn.tailwindcss.com"></script>

<!-- Lucide Icons pour les icônes -->

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* Personnalisation de la scrollbar pour qu'elle soit invisible (style mobile) */

::-webkit-scrollbar { width: 0px; background: transparent; }

body { -webkit-tap-highlight-color: transparent; }

</style>

</head>

<body class="bg-black text-gray-200 font-sans selection:bg-cyan-500/30">




<div class="flex justify-center w-full min-h-screen">

<div class="w-full min-h-screen bg-[#0D0F12] flex flex-col relative overflow-hidden">


<!-- Header -->

<header class="pt-12 pb-4 px-6 bg-gradient-to-b from-[#161a22] to-[#0D0F12] flex items-center justify-between z-10">

<h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">

<i data-lucide="zap" class="text-cyan-400 fill-cyan-400"></i>

OS de Vie

</h1>

<div class="h-8 w-8 rounded-full bg-[#1A1D24] flex items-center justify-center border border-gray-800">

<span class="text-xs font-bold text-emerald-400">V1</span>

</div>

</header>




<!-- Main Content Area -->

<main id="app-content" class="flex-1 overflow-y-auto pb-24 px-4"></main>




<!-- Bottom Navigation -->

<nav class="fixed bottom-0 w-full max-w-md bg-[#13161c]/90 backdrop-blur-md border-t border-gray-800 px-6 py-4 flex justify-between items-center z-20 pb-8">

<button onclick="App.setTab('home')" id="nav-home" class="flex flex-col items-center gap-1 transition-all text-gray-500">

<i data-lucide="home" id="icon-home"></i>

<span class="text-[10px] font-bold tracking-wider uppercase">Action</span>

</button>

<button onclick="App.setTab('projects')" id="nav-projects" class="flex flex-col items-center gap-1 transition-all text-gray-500">

<i data-lucide="folder" id="icon-projects"></i>

<span class="text-[10px] font-bold tracking-wider uppercase">Projets</span>

</button>

<button onclick="App.setTab('bank')" id="nav-bank" class="flex flex-col items-center gap-1 transition-all text-gray-500">

<i data-lucide="list-todo" id="icon-bank"></i>

<span class="text-[10px] font-bold tracking-wider uppercase">Banque</span>

</button>

</nav>

</div>

</div>




<!-- Application Logic -->

<script>

// Initial Data

const INITIAL_PROJECTS = [

{ id: 'p1', name: 'Poulailler', deadline: '2026-09-01' },

{ id: 'p2', name: 'Entretien Peugeot', deadline: '2026-08-20' }

];




const INITIAL_TASKS = [

{ id: 't1', projectId: 'p1', name: 'Acheter le bois', deadline: '', duration: 60, energy: 'Haute', status: 'done', subtasks: [] },

{ id: 't2', projectId: 'p1', name: 'Monter les murs', deadline: '', duration: 120, energy: 'Haute', status: 'todo', subtasks: [{id: 's1', name: 'Découper planches', status: 'todo'}, {id: 's2', name: 'Visser', status: 'todo'}] },

{ id: 't3', projectId: 'p2', name: 'Prendre rdv garage', deadline: '2026-08-15', duration: 15, energy: 'Basse', status: 'todo', subtasks: [] },

{ id: 't4', projectId: null, name: 'Appeler le dentiste', deadline: '2026-08-13', duration: 15, energy: 'Basse', status: 'todo', subtasks: [] },

{ id: 't5', projectId: null, name: 'Déclarer impôts', deadline: '2026-08-14', duration: 30, energy: 'Haute', status: 'todo', subtasks: [] },

];




// Global State

const AppState = {

activeTab: 'home',

projects: JSON.parse(localStorage.getItem('osdevie_projects')) || INITIAL_PROJECTS,

tasks: JSON.parse(localStorage.getItem('osdevie_tasks')) || INITIAL_TASKS,


// Home View State

homeTime: 30,

homeEnergy: 'Moyenne',

homeSuggestions: [],

homeSearched: false,




// Projects View State

expandedProjectId: null,

showAddProject: false,




// Bank View State

bankFilter: 'all'

};




// Main App Controller

const App = {

save() {

localStorage.setItem('osdevie_projects', JSON.stringify(AppState.projects));

localStorage.setItem('osdevie_tasks', JSON.stringify(AppState.tasks));

this.render();

},




setTab(tab) {

AppState.activeTab = tab;

this.render();

},




toggleTask(taskId) {

AppState.tasks = AppState.tasks.map(t =>

t.id === taskId ? { ...t, status: t.status === 'todo' ? 'done' : 'todo' } : t

);

// Si on coche, on relance la recherche pour mettre à jour les suggestions

if(AppState.homeSearched) this.generateAction();

this.save();

},




toggleSubtask(taskId, subtaskId) {

AppState.tasks = AppState.tasks.map(t => {

if (t.id === taskId) {

return {

...t,

subtasks: t.subtasks.map(s => s.id === subtaskId ? { ...s, status: s.status === 'todo' ? 'done' : 'todo' } : s)

};

}

return t;

});

this.save();

},




addTask(event) {

event.preventDefault();

const name = document.getElementById('new-task-name').value;

const projectId = document.getElementById('new-task-project').value;

const duration = document.getElementById('new-task-duration').value;


// Get selected energy from UI buttons

const energy = document.querySelector('.energy-btn-selected').innerText.trim();




if (!name.trim()) return;




const newTask = {

id: Date.now().toString(),

name,

projectId: projectId || null,

duration: parseInt(duration),

energy,

deadline: '',

status: 'todo',

subtasks: []

};




AppState.tasks.unshift(newTask);

this.save();

},




addProject() {

const name = document.getElementById('new-proj-name').value;

if (!name.trim()) return;


AppState.projects.push({ id: Date.now().toString(), name, deadline: '' });

AppState.showAddProject = false;

this.save();

},




// --- UI ACTIONS ---

setHomeTime(time) { AppState.homeTime = time; this.render(); },

setHomeEnergy(energy) { AppState.homeEnergy = energy; this.render(); },


generateAction() {

const energyLevels = { 'Basse': 1, 'Moyenne': 2, 'Haute': 3 };

const available = AppState.tasks.filter(t =>

t.status !== 'done' &&

t.duration <= AppState.homeTime &&

(energyLevels[t.energy] <= energyLevels[AppState.homeEnergy])

);


AppState.homeSuggestions = available.sort((a, b) => b.duration - a.duration).slice(0, 3);

AppState.homeSearched = true;

this.render();

},




toggleProjectExpand(id) {

AppState.expandedProjectId = AppState.expandedProjectId === id ? null : id;

this.render();

},


toggleAddProject() {

AppState.showAddProject = !AppState.showAddProject;

this.render();

},




setBankFilter(filter) {

AppState.bankFilter = filter;

this.render();

},




// --- RENDERING TEMPLATES ---

renderTask(task, minimal = false) {

const isDone = task.status === 'done';

const energyColors = { 'Haute': 'text-purple-400', 'Moyenne': 'text-cyan-400', 'Basse': 'text-gray-500' };


return `

<div onclick="App.toggleTask('${task.id}')" class="group flex items-center justify-between p-4 rounded-2xl cursor-pointer transition-all duration-300 border ${isDone ? 'bg-[#13161c] border-gray-800/30 opacity-60' : 'bg-[#1A1D24] border-gray-800 hover:border-gray-700'}">

<div class="flex items-center gap-4 overflow-hidden">

${isDone

? `<i data-lucide="check-circle-2" class="text-emerald-500 shrink-0 drop-shadow-[0_0_5px_rgba(16,185,129,0.5)]"></i>`

: `<i data-lucide="circle" class="text-gray-600 shrink-0"></i>`

}

<div class="flex-1 min-w-0">

<h4 class="font-bold truncate text-[15px] transition-colors ${isDone ? 'text-gray-500 line-through' : 'text-gray-200'}">${task.name}</h4>

${!minimal && !isDone ? `

<div class="flex items-center gap-3 mt-1 text-xs font-semibold text-gray-500">

<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${task.duration}m</span>

<span class="flex items-center gap-1">

<i data-lucide="zap" class="w-3 h-3 ${energyColors[task.energy]}"></i> ${task.energy}

</span>

</div>

` : ''}

</div>

</div>

</div>`;

},




renderHome() {

const now = new Date();

const urgencies = AppState.tasks.filter(t => {

if (t.status === 'done') return false;

if (t.projectId === null) return true;

if (t.deadline) {

const diff = new Date(t.deadline) - now;

return diff < 3 * 24 * 60 * 60 * 1000;

}

return false;

}).slice(0, 5);




return `

<div class="space-y-8 animate-[fadeIn_0.5s_ease-out]">

<!-- Moteur d'Action -->

<section class="bg-[#1A1D24] rounded-3xl p-5 border border-gray-800/50 relative overflow-hidden">

<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-purple-600"></div>

<h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">

<i data-lucide="play" class="text-cyan-400 fill-cyan-400 w-5 h-5"></i> Moteur d'Action

</h2>


<div class="space-y-4">

<div>

<label class="text-xs font-semibold text-gray-400 uppercase mb-2 block">Temps dispo (min)</label>

<div class="flex gap-2">

${[15, 30, 60, 120].map(t => `

<button onclick="App.setHomeTime(${t})" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all ${AppState.homeTime === t ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50' : 'bg-[#0D0F12] text-gray-400 border border-transparent'}">

${t}${t===120 ? '+' : ''}

</button>

`).join('')}

</div>

</div>


<div>

<label class="text-xs font-semibold text-gray-400 uppercase mb-2 block">Énergie</label>

<div class="flex gap-2">

${['Basse', 'Moyenne', 'Haute'].map((e, idx) => `

<button onclick="App.setHomeEnergy('${e}')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-1 ${AppState.homeEnergy === e ? 'bg-purple-500/20 text-purple-400 border border-purple-500/50' : 'bg-[#0D0F12] text-gray-400 border border-transparent'}">

${idx >= 0 ? `<i data-lucide="zap" class="w-3.5 h-3.5 ${AppState.homeEnergy === e ? 'text-purple-400 fill-purple-400' : 'text-gray-500'}"></i>` : ''}

${idx >= 1 ? `<i data-lucide="zap" class="w-3.5 h-3.5 ${AppState.homeEnergy === e ? 'text-purple-400 fill-purple-400' : 'text-gray-500'}"></i>` : ''}

${idx >= 2 ? `<i data-lucide="zap" class="w-3.5 h-3.5 ${AppState.homeEnergy === e ? 'text-purple-400 fill-purple-400' : 'text-gray-500'}"></i>` : ''}

</button>

`).join('')}

</div>

</div>




<button onclick="App.generateAction()" class="w-full py-4 mt-2 rounded-xl bg-cyan-500 text-black font-black text-lg tracking-wide uppercase transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)] active:scale-95">

Trouver quoi faire

</button>

</div>




${AppState.homeSearched ? `

<div class="mt-6 pt-4 border-t border-gray-800">

<h3 class="text-xs font-bold text-gray-500 mb-3 uppercase">Résultats (${AppState.homeSuggestions.length})</h3>

${AppState.homeSuggestions.length > 0

? `<div class="space-y-2">${AppState.homeSuggestions.map(t => this.renderTask(t)).join('')}</div>`

: `<p class="text-sm text-gray-500 text-center py-4">Aucune tâche ne correspond. Prenez une pause ! ☕</p>`

}

</div>` : ''}

</section>




<!-- Urgences -->

<section>

<h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 px-1 flex items-center gap-2">

<i data-lucide="alert-circle" class="text-emerald-400 w-4 h-4"></i> Urgences & Rapides

</h2>

<div class="space-y-2">

${urgencies.length > 0

? urgencies.map(t => this.renderTask(t)).join('')

: `<div class="bg-[#1A1D24] rounded-2xl p-6 text-center border border-gray-800 border-dashed"><p class="text-gray-500 text-sm">Tout est sous contrôle.</p></div>`

}

</div>

</section>

</div>`;

},




renderProjects() {

let html = `

<div class="space-y-4 animate-[fadeIn_0.3s_ease-out]">

<div class="flex justify-between items-center mb-6 px-1">

<h2 class="text-xl font-black text-white">Grands Chantiers</h2>

<button onclick="App.toggleAddProject()" class="h-8 w-8 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center border border-purple-500/30">

<i data-lucide="plus" class="w-4 h-4"></i>

</button>

</div>`;




if(AppState.showAddProject) {

html += `

<div class="bg-[#1A1D24] p-4 rounded-2xl border border-purple-500/30 mb-4 flex gap-2">

<input type="text" id="new-proj-name" placeholder="Nom du projet..." class="flex-1 bg-[#0D0F12] rounded-lg px-3 py-2 text-sm text-white focus:outline-none border border-gray-800">

<button onclick="App.addProject()" class="bg-purple-500 text-white px-4 py-2 rounded-lg text-sm font-bold">OK</button>

</div>`;

}




html += AppState.projects.map(project => {

const projectTasks = AppState.tasks.filter(t => t.projectId === project.id);


let totalItems = 0, completedItems = 0;

projectTasks.forEach(t => {

totalItems += 1;

if (t.status === 'done') completedItems += 1;

if (t.subtasks) {

t.subtasks.forEach(s => {

totalItems += 1;

if (s.status === 'done') completedItems += 1;

});

}

});




const progress = totalItems === 0 ? 0 : Math.round((completedItems / totalItems) * 100);

const isExpanded = AppState.expandedProjectId === project.id;




return `

<div class="bg-[#1A1D24] rounded-2xl border border-gray-800 overflow-hidden transition-all duration-300">

<div onclick="App.toggleProjectExpand('${project.id}')" class="p-5 cursor-pointer">

<div class="flex justify-between items-start mb-3">

<div class="flex items-center gap-3">

<div class="p-2 rounded-xl ${progress === 100 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-purple-500/20 text-purple-400'}">

<i data-lucide="folder" class="w-5 h-5 fill-current opacity-50"></i>

</div>

<div>

<h3 class="font-bold text-lg ${progress === 100 ? 'text-gray-400 line-through' : 'text-white'}">${project.name}</h3>

${project.deadline ? `<span class="text-xs text-gray-500 flex items-center gap-1 mt-1"><i data-lucide="calendar" class="w-3 h-3"></i> Échéance: ${project.deadline}</span>` : ''}

</div>

</div>

<i data-lucide="${isExpanded ? 'chevron-down' : 'chevron-right'}" class="text-gray-500 w-5 h-5"></i>

</div>




<div class="mt-4 flex items-center gap-3">

<div class="h-2 w-full bg-[#0D0F12] rounded-full overflow-hidden border border-gray-800/50">

<div class="h-full rounded-full transition-all duration-1000 ${progress === 100 ? 'bg-emerald-400' : 'bg-gradient-to-r from-purple-600 to-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.5)]'}" style="width: ${progress}%"></div>

</div>

<span class="text-xs font-bold text-gray-400 w-8 text-right">${progress}%</span>

</div>

</div>




${isExpanded ? `

<div class="px-5 pb-5 border-t border-gray-800/50 pt-4 bg-[#13161c]">

${projectTasks.length === 0 ? `<p class="text-sm text-gray-500 text-center py-2">Aucune tâche pour le moment.</p>` : `

<div class="space-y-3">

${projectTasks.map(task => `

<div>

${this.renderTask(task, true)}

${task.subtasks && task.subtasks.length > 0 ? `

<div class="ml-8 mt-2 space-y-2 border-l border-gray-800 pl-3">

${task.subtasks.map(sub => `

<div onclick="App.toggleSubtask('${task.id}', '${sub.id}')" class="flex items-center gap-2 cursor-pointer group py-1">

<i data-lucide="${sub.status === 'done' ? 'check-circle-2' : 'circle'}" class="${sub.status === 'done' ? 'text-emerald-500' : 'text-gray-600'} w-3.5 h-3.5 shrink-0"></i>

<span class="text-sm ${sub.status === 'done' ? 'text-gray-600 line-through' : 'text-gray-300'}">${sub.name}</span>

</div>

`).join('')}

</div>` : ''}

</div>

`).join('')}

</div>

`}

</div>

` : ''}

</div>`;

}).join('');




return html + `</div>`;

},




renderBank() {

const filteredTasks = AppState.tasks.filter(t => {

if (AppState.bankFilter === 'isolated') return t.projectId === null && t.status !== 'done';

return t.status !== 'done';

});




return `

<div class="space-y-6 animate-[fadeIn_0.3s_ease-out]">

<!-- Quick Add Form -->

<section class="bg-gradient-to-br from-[#1A1D24] to-[#13161c] rounded-3xl p-5 border border-gray-800">

<h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2">

<i data-lucide="plus" class="text-emerald-400 w-4 h-4"></i> Ajout Rapide

</h2>


<form onsubmit="App.addTask(event)" class="space-y-4">

<input type="text" id="new-task-name" placeholder="Que faut-il faire ?" required class="w-full bg-[#0D0F12] rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 border border-gray-800">


<div class="flex gap-2">

<select id="new-task-project" class="flex-1 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800">

<option value="">Projet : Aucun (Isolée)</option>

${AppState.projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}

</select>


<select id="new-task-duration" class="w-24 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 text-center">

<option value="5">5m</option>

<option value="15" selected>15m</option>

<option value="30">30m</option>

<option value="60">1h</option>

<option value="120">2h+</option>

</select>

</div>




<div class="flex gap-2" id="new-task-energy-container">

${['Basse', 'Moyenne', 'Haute'].map(e => `

<button type="button" onclick="App.selectBankEnergy(this)" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all ${e === 'Basse' ? 'energy-btn-selected bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-[#0D0F12] text-gray-500 border border-transparent'}">

${e}

</button>

`).join('')}

</div>




<button type="submit" class="w-full py-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 font-bold uppercase tracking-wide active:bg-emerald-500 active:text-black transition-colors">

Ajouter au système

</button>

</form>

</section>




<!-- Task List -->

<section>

<div class="flex justify-between items-end mb-4 px-1">

<h2 class="text-xl font-black text-white">Toutes les tâches</h2>

<div class="flex gap-2">

<button onclick="App.setBankFilter('all')" class="text-xs px-3 py-1 rounded-full font-bold ${AppState.bankFilter === 'all' ? 'bg-gray-700 text-white' : 'bg-[#1A1D24] text-gray-500'}">Toutes</button>

<button onclick="App.setBankFilter('isolated')" class="text-xs px-3 py-1 rounded-full font-bold ${AppState.bankFilter === 'isolated' ? 'bg-gray-700 text-white' : 'bg-[#1A1D24] text-gray-500'}">Isolées</button>

</div>

</div>




<div class="space-y-2 pb-10">

${filteredTasks.length > 0

? filteredTasks.map(t => this.renderTask(t)).join('')

: `<p class="text-center text-gray-500 text-sm py-8">Aucune tâche en attente.</p>`

}

</div>

</section>

</div>`;

},




// Aide visuelle pour la sélection d'énergie du formulaire d'ajout

selectBankEnergy(btn) {

const btns = btn.parentElement.querySelectorAll('button');

btns.forEach(b => {

b.classList.remove('energy-btn-selected', 'bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');

b.classList.add('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');

});

btn.classList.add('energy-btn-selected', 'bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');

btn.classList.remove('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');

},




// --- MAIN RENDER CYCLE ---

render() {

const content = document.getElementById('app-content');


if (AppState.activeTab === 'home') content.innerHTML = this.renderHome();

else if (AppState.activeTab === 'projects') content.innerHTML = this.renderProjects();

else if (AppState.activeTab === 'bank') content.innerHTML = this.renderBank();




this.updateNavUI();


// Rafraîchir les icônes Lucide fraîchement injectées dans le DOM

lucide.createIcons();

},




updateNavUI() {

const tabs = [

{ id: 'home', color: 'text-cyan-400', stroke: 2.5 },

{ id: 'projects', color: 'text-purple-500', stroke: 2.5 },

{ id: 'bank', color: 'text-emerald-400', stroke: 2.5 }

];




tabs.forEach(tab => {

const btn = document.getElementById(`nav-${tab.id}`);

const icon = document.getElementById(`icon-${tab.id}`);


if (AppState.activeTab === tab.id) {

btn.className = `flex flex-col items-center gap-1 transition-all ${tab.color} scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.3)]`;

icon.setAttribute('stroke-width', tab.stroke);

} else {

btn.className = `flex flex-col items-center gap-1 transition-all text-gray-500 scale-100`;

icon.setAttribute('stroke-width', '2');

}

});

}

};




// Custom animation definition for Tailwind

tailwind.config = {

theme: {

extend: {

keyframes: {

fadeIn: {

'0%': { opacity: '0', transform: 'translateY(10px)' },

'100%': { opacity: '1', transform: 'translateY(0)' },

}

}

}

}

}




// Initialize App on load

window.onload = () => {

App.render();

};




</script>

</body>

</html>
