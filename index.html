<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OS de Vie</title>
    <!-- Tailwind pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide pour les icônes -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Polyfill OBLIGATOIRE pour faire marcher le Glisser-Déposer avec le doigt sur Smartphone -->
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .draggable-item { cursor: grab; transition: transform 0.2s ease, background-color 0.2s ease; }
        .draggable-item:active { cursor: grabbing; }
        .dragging { opacity: 0.4; background: #13161c; transform: scale(1.02); }
        .drag-over { border-top: 2px dashed #06b6d4 !important; }
    </style>
</head>
<body class="bg-black text-gray-200 font-sans selection:bg-cyan-500/30">
    <div class="flex justify-center w-full min-h-screen">
        <div class="w-full min-h-screen bg-[#0D0F12] flex flex-col relative overflow-hidden" id="app-container">
            <header class="pt-12 pb-4 px-6 bg-gradient-to-b from-[#161a22] to-[#0D0F12] flex items-center justify-between z-10">
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="zap" class="text-cyan-400 fill-cyan-400"></i>
                    OS de Vie
                </h1>
            </header>
            <main id="app-content" class="flex-1 overflow-y-auto pb-24 px-4"></main>
        </div>
    </div>
    <script>
        const INITIAL_PROJECTS = [{id:'p1',name:'Poulailler',deadline:'2026-09-01'},{id:'p2',name:'Entretien Peugeot',deadline:'2026-08-20'}];
        const INITIAL_TASKS = [{id:'t1',projectId:'p1',name:'Acheter le bois',deadline:'',duration:60,energy:'Haute',status:'done',subtasks:[]},{id:'t2',projectId:'p1',name:'Monter les murs',deadline:'',duration:120,energy:'Haute',status:'todo',subtasks:[{id:'s1',name:'Découper planches',status:'todo'},{id:'s2',name:'Visser',status:'todo'}]},{id:'t3',projectId:'p2',name:'Prendre rdv garage',deadline:'2026-08-15',duration:15,energy:'Basse',status:'todo',subtasks:[]},{id:'t4',projectId:null,name:'Appeler le dentiste',deadline:'2026-08-13',duration:15,energy:'Basse',status:'todo',subtasks:[]},{id:'t5',projectId:null,name:'Déclarer impôts',deadline:'2026-08-14',duration:30,energy:'Haute',status:'todo',subtasks:[]}];
        
        const AppState = {
            activeTab:'home',
            projects:JSON.parse(localStorage.getItem('osdevie_projects'))||INITIAL_PROJECTS,
            tasks:JSON.parse(localStorage.getItem('osdevie_tasks'))||INITIAL_TASKS,
            homeTime:30,
            homeEnergy:'Moyenne',
            homeSuggestions:[],
            homeSearched:false,
            expandedProjectId:null,
            showAddProject:false,
            bankFilter:'all',
            showProjectAddTaskModal: null,
            showProjectAddSubtaskModal: null
        };

        const App = {
            save(){
                localStorage.setItem('osdevie_projects',JSON.stringify(AppState.projects));
                localStorage.setItem('osdevie_tasks',JSON.stringify(AppState.tasks));
                this.render();
            },
            setTab(tab){AppState.activeTab=tab;this.render();},
            toggleTask(taskId){
                AppState.tasks=AppState.tasks.map(t=>t.id===taskId?{...t,status:t.status==='todo'?'done':'todo'}:t);
                if(AppState.homeSearched)this.generateAction();
                this.save();
            },
            toggleSubtask(taskId,subtaskId){
                AppState.tasks=AppState.tasks.map(t=>{
                    if(t.id===taskId){
                        return{...t,subtasks:t.subtasks.map(s=>s.id===subtaskId?{...s,status:s.status==='todo'?'done':'todo'}:s)}
                    }
                    return t;
                });
                this.save();
            },
            addTask(event){
                event.preventDefault();
                const name=document.getElementById('new-task-name').value;
                const projectId=document.getElementById('new-task-project').value;
                const duration=document.getElementById('new-task-duration').value;
                const energy=document.querySelector('.energy-btn-selected')?document.querySelector('.energy-btn-selected').innerText.trim():'Basse';
                if(!name.trim())return;
                AppState.tasks.unshift({id:Date.now().toString(),name,projectId:projectId||null,duration:parseInt(duration),energy,deadline:'',status:'todo',subtasks:[]});
                this.save();
            },
            addProjectTask(projectId){
                const input = document.getElementById(`project-quick-task-${projectId}`);
                if(!input) return;
                const name = input.value;
                if(!name.trim())return;
                AppState.tasks.unshift({id:Date.now().toString(),name,projectId:projectId,duration:15,energy:'Basse',deadline:'',status:'todo',subtasks:[]});
                AppState.showProjectAddTaskModal = null;
                this.save();
            },
            addSubtask(taskId){
                const input = document.getElementById(`task-quick-subtask-${taskId}`);
                if(!input) return;
                const name = input.value;
                if(!name.trim())return;
                AppState.tasks = AppState.tasks.map(t => {
                    if(t.id === taskId) {
                        return {...t, subtasks: [...(t.subtasks||[]), {id: Date.now().toString(), name, status: 'todo'}]};
                    }
                    return t;
                });
                AppState.showProjectAddSubtaskModal = null;
                this.save();
            },
            addProject(){
                const name=document.getElementById('new-proj-name').value;
                if(!name.trim())return;
                AppState.projects.push({id:Date.now().toString(),name,deadline:''});
                AppState.showAddProject=false;
                this.save();
            },
            setHomeTime(time){AppState.homeTime=time;this.render();},
            setHomeEnergy(energy){AppState.homeEnergy=energy;this.render();},
            generateAction(){
                const energyLevels={'Basse':1,'Moyenne':2,'Haute':3};
                const available=AppState.tasks.filter(t=>t.status!=='done'&&t.duration<=AppState.homeTime&&(energyLevels[t.energy]<=energyLevels[AppState.homeEnergy]));
                AppState.homeSuggestions=available.sort((a,b)=>b.duration-a.duration).slice(0,3);
                AppState.homeSearched=true;
                this.render();
            },
            toggleProjectExpand(id){AppState.expandedProjectId=AppState.expandedProjectId===id?null:id;this.render();},
            toggleAddProject(){AppState.showAddProject=!AppState.showAddProject;this.render();},
            setBankFilter(filter){AppState.bankFilter=filter;this.render();},
            
            handleDragStart(e, id, type, parentId = null) {
                e.dataTransfer.setData('text/plain', JSON.stringify({id, type, parentId}));
                e.currentTarget.classList.add('dragging');
            },
            handleDragEnd(e) {
                e.currentTarget.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            },
            handleDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add('drag-over');
            },
            handleDragLeave(e) {
                e.currentTarget.classList.remove('drag-over');
            },
            handleDrop(e, targetId, type, parentId = null) {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                try {
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    if (data.type !== type) return;
                    
                    if (type === 'task') {
                        const oldIndex = AppState.tasks.findIndex(t => t.id === data.id);
                        const newIndex = AppState.tasks.findIndex(t => t.id === targetId);
                        if (oldIndex !== -1 && newIndex !== -1) {
                            const [moved] = AppState.tasks.splice(oldIndex, 1);
                            AppState.tasks.splice(newIndex, 0, moved);
                            this.save();
                        }
                    } else if (type === 'subtask' && data.parentId === parentId) {
                        AppState.tasks = AppState.tasks.map(t => {
                            if (t.id === parentId) {
                                const subs = [...t.subtasks];
                                const oldIndex = subs.findIndex(s => s.id === data.id);
                                const newIndex = subs.findIndex(s => s.id === targetId);
                                if (oldIndex !== -1 && newIndex !== -1) {
                                    const [moved] = subs.splice(oldIndex, 1);
                                    subs.splice(newIndex, 0, moved);
                                }
                                return {...t, subtasks: subs};
                            }
                            return t;
                        });
                        this.save();
                    }
                } catch(err) { console.error(err); }
            },

            renderTask(task, minimal=false){
                const isDone=task.status==='done';
                const energyColors={'Haute':'text-cyan-400','Moyenne':'text-cyan-400','Basse':'text-gray-500'};
                return `
                <div draggable="true" 
                     ondragstart="App.handleDragStart(event, '${task.id}', 'task')" 
                     ondragend="App.handleDragEnd(event)" 
                     ondragover="App.handleDragOver(event)" 
                     ondragleave="App.handleDragLeave(event)" 
                     ondrop="App.handleDrop(event, '${task.id}', 'task')"
                     class="draggable-item group flex items-center justify-between p-4 rounded-2xl cursor-pointer transition-all duration-300 border ${isDone?'bg-[#13161c] border-gray-800/30 opacity-60':'bg-[#1A1D24] border-gray-800 hover:border-gray-700'}">
                    <div class="flex items-center gap-4 overflow-hidden flex-1" onclick="App.toggleTask('${task.id}')">
                        ${isDone?'<i data-lucide="check-circle-2" class="text-emerald-500 shrink-0"></i>':'<i data-lucide="circle" class="text-gray-600 shrink-0"></i>'}
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold truncate text-[15px] ${isDone?'text-gray-500 line-through':'text-gray-200'}">${task.name}</h4>
                            ${!minimal&&!isDone?`<div class="flex items-center gap-3 mt-1 text-xs font-semibold text-gray-500"><span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${task.duration}m</span><span class="flex items-center gap-1"><i data-lucide="zap" class="w-3 h-3 ${energyColors[task.energy]}"></i> ${task.energy}</span></div>`:''}
                        </div>
                    </div>
                    ${minimal ? `
                        <button onclick="event.stopPropagation(); AppState.showProjectAddSubtaskModal = '${task.id}'; App.render();" class="p-2 text-gray-400 hover:text-cyan-400" title="Ajouter une sous-tâche">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                </div>`;
            },
            renderHome(){
                const now=new Date();
                const urgencies=AppState.tasks.filter(t=>{if(t.status==='done')return false;if(t.projectId===null)return true;if(t.deadline){const diff=new Date(t.deadline)-now;return diff<3*24*60*60*1000};return false;}).slice(0,5);
                return `
                <div class="space-y-8">
                    <section class="bg-[#1A1D24] rounded-3xl p-5 border border-gray-800/50 relative">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-emerald-500"></div>
                        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="play" class="text-cyan-400 fill-cyan-400 w-5 h-5"></i> Moteur d'Action</h2>
                        <div class="space-y-4">
                            <div><label class="text-xs font-semibold text-gray-400 uppercase mb-2 block">Temps dispo (min)</label>
                                <div class="flex gap-2">${[15,30,60,120].map(t=>`<button onclick="App.setHomeTime(${t})" class="flex-1 py-2 rounded-xl text-sm font-bold ${AppState.homeTime===t?'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50':'bg-[#0D0F12] text-gray-400 border border-transparent'}">${t}${t===120?'+':''}</button>`).join('')}</div>
                            </div>
                            <div><label class="text-xs font-semibold text-gray-400 uppercase mb-2 block">Énergie</label>
                                <div class="flex gap-2">${['Basse','Moyenne','Haute'].map(e=>`<button onclick="App.setHomeEnergy('${e}')" class="flex-1 py-2 rounded-xl text-sm font-bold ${AppState.homeEnergy===e?'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50':'bg-[#0D0F12] text-gray-400 border border-transparent'}">${e}</button>`).join('')}</div>
                            </div>
                            <button onclick="App.generateAction()" class="w-full py-4 mt-2 rounded-xl bg-cyan-500 text-black font-black text-lg uppercase transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">Trouver quoi faire</button>
                        </div>
                        ${AppState.homeSearched?`<div class="mt-6 pt-4 border-t border-gray-800"><h3 class="text-xs font-bold text-gray-500 mb-3 uppercase">Résultats (${AppState.homeSuggestions.length})</h3>${AppState.homeSuggestions.length>0?`<div class="space-y-2">${AppState.homeSuggestions.map(t=>this.renderTask(t)).join('')}</div>`:`<p class="text-sm text-gray-500 text-center py-4">Aucune tâche ne correspond.</p>`}</div>`:''}
                    </section>
                    <section>
                        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 px-1 flex items-center gap-2"><i data-lucide="alert-circle" class="text-emerald-400 w-4 h-4"></i> Urgences & Rapides</h2>
                        <div class="space-y-2">${urgencies.length>0?urgencies.map(t=>this.renderTask(t)).join(''):`<div class="bg-[#1A1D24] rounded-2xl p-6 text-center border border-gray-800 border-dashed"><p class="text-gray-500 text-sm">Tout est sous contrôle.</p></div>`}</div>
                    </section>
                </div>`;
            },
            renderProjects(){
                let html=`<div class="space-y-4"><div class="flex justify-between items-center mb-6 px-1"><h2 class="text-xl font-black text-white">Grands Chantiers</h2><button onclick="App.toggleAddProject()" class="h-8 w-8 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center border border-cyan-500/30"><i data-lucide="plus" class="w-4 h-4"></i></button></div>`;
                if(AppState.showAddProject)html+=`<div class="bg-[#1A1D24] p-4 rounded-2xl border border-cyan-500/30 mb-4 flex gap-2"><input type="text" id="new-proj-name" placeholder="Nom du projet..." class="flex-1 bg-[#0D0F12] rounded-lg px-3 py-2 text-sm text-white focus:outline-none border border-gray-800"><button onclick="App.addProject()" class="bg-cyan-500 text-black px-4 py-2 rounded-lg text-sm font-bold">OK</button></div>`;
                
                html+=AppState.projects.map(project=>{
                    const projectTasks=AppState.tasks.filter(t=>t.projectId===project.id);
                    let total=0,comp=0;
                    projectTasks.forEach(t=>{
                        total++;if(t.status==='done')comp++;
                        if(t.subtasks){t.subtasks.forEach(s=>{total++;if(s.status==='done')comp++})}
                    });
                    const prog=total===0?0:Math.round((comp/total)*100);
                    const exp=AppState.expandedProjectId===project.id;
                    
                    return `
                    <div class="bg-[#1A1D24] rounded-2xl border border-gray-800 overflow-hidden">
                        <div onclick="App.toggleProjectExpand('${project.id}')" class="p-5 cursor-pointer">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center gap-3">
                                    <div class="p-2 rounded-xl ${prog===100?'bg-emerald-500/20 text-emerald-400':'bg-cyan-500/20 text-cyan-400'}"><i data-lucide="folder" class="w-5 h-5 fill-current opacity-50"></i></div>
                                    <div><h3 class="font-bold text-lg ${prog===100?'text-gray-400 line-through':'text-white'}">${project.name}</h3></div>
                                </div>
                                <i data-lucide="${exp?'chevron-down':'chevron-right'}" class="text-gray-500 w-5 h-5"></i>
                            </div>
                            <div class="mt-4 flex items-center gap-3">
                                <div class="h-2 w-full bg-[#0D0F12] rounded-full overflow-hidden border border-gray-800/50"><div class="h-full rounded-full transition-all duration-1000 ${prog===100?'bg-emerald-400':'bg-gradient-to-r from-cyan-600 to-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.5)]'}" style="width:${prog}%"></div></div>
                                <span class="text-xs font-bold text-gray-400 w-8 text-right">${prog}%</span>
                            </div>
                        </div>
                        
                        ${exp?`<div class="px-5 pb-5 border-t border-gray-800/50 pt-4 bg-[#13161c]">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs font-bold text-gray-400 uppercase">Tâches du projet</span>
                                <button onclick="AppState.showProjectAddTaskModal = '${project.id}'; App.render();" class="flex items-center gap-1 text-xs text-cyan-400 bg-cyan-500/10 px-2.5 py-1 rounded-lg border border-cyan-500/30">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Ajouter tâche
                                </button>
                            </div>

                            ${AppState.showProjectAddTaskModal === project.id ? `
                                <div class="mb-3 flex gap-2 bg-[#0D0F12] p-2 rounded-xl border border-gray-800" onclick="event.stopPropagation()">
                                    <input type="text" id="project-quick-task-${project.id}" onkeydown="if(event.key==='Enter') App.addProjectTask('${project.id}')" placeholder="Nouvelle tâche..." class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none" autofocus>
                                    <button type="button" onclick="App.addProjectTask('${project.id}')" class="bg-cyan-500 text-black px-3 py-1 rounded-lg text-xs font-bold">Ajouter</button>
                                </div>
                            `:''}

                            ${projectTasks.length===0?'<p class="text-sm text-gray-500 text-center py-2">Aucune tâche.</p>':projectTasks.map(task=>`
                                <div class="space-y-2 mb-2">
                                    ${this.renderTask(task,true)}
                                    
                                    ${AppState.showProjectAddSubtaskModal === task.id ? `
                                        <div class="ml-8 mb-2 flex gap-2 bg-[#0D0F12] p-2 rounded-xl border border-gray-800" onclick="event.stopPropagation()">
                                            <input type="text" id="task-quick-subtask-${task.id}" onkeydown="if(event.key==='Enter') App.addSubtask('${task.id}')" placeholder="Nouvelle sous-tâche..." class="flex-1 bg-transparent px-2 text-sm text-white focus:outline-none" autofocus>
                                            <button type="button" onclick="App.addSubtask('${task.id}')" class="bg-cyan-500 text-black px-3 py-1 rounded-lg text-xs font-bold">OK</button>
                                        </div>
                                    `:''}

                                    ${task.subtasks&&task.subtasks.length>0?`<div class="ml-8 space-y-1 border-l border-gray-800 pl-3">${task.subtasks.map(sub=>`
                                        <div draggable="true" 
                                             ondragstart="App.handleDragStart(event, '${sub.id}', 'subtask', '${task.id}')" 
                                             ondragend="App.handleDragEnd(event)" 
                                             ondragover="App.handleDragOver(event)" 
                                             ondragleave="App.handleDragLeave(event)" 
                                             ondrop="App.handleDrop(event, '${sub.id}', 'subtask', '${task.id}')"
                                             onclick="App.toggleSubtask('${task.id}','${sub.id}')" class="draggable-item flex items-center gap-2 cursor-pointer py-1.5 px-2 rounded-lg hover:bg-[#1A1D24]">
                                            <i data-lucide="${sub.status==='done'?'check-circle-2':'circle'}" class="${sub.status==='done'?'text-emerald-500':'text-gray-600'} w-3.5 h-3.5"></i>
                                            <span class="text-sm ${sub.status==='done'?'text-gray-600 line-through':'text-gray-300'}">${sub.name}</span>
                                        </div>`).join('')}</div>`:''}
                                </div>
                            `).join('')}
                        </div>`:''}
                    </div>`;
                }).join('');
                return html+'</div>';
            },
            renderBank(){
                const filtered=AppState.tasks.filter(t=>{if(AppState.bankFilter==='isolated')return t.projectId===null&&t.status!=='done';return t.status!=='done'});
                return `
                <div class="space-y-6">
                    <section class="bg-gradient-to-br from-[#1A1D24] to-[#13161c] rounded-3xl p-5 border border-gray-800">
                        <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-4 flex items-center gap-2"><i data-lucide="plus" class="text-emerald-400 w-4 h-4"></i> Ajout Rapide</h2>
                        <form onsubmit="App.addTask(event)" class="space-y-4">
                            <input type="text" id="new-task-name" placeholder="Que faut-il faire ?" required class="w-full bg-[#0D0F12] rounded-xl px-4 py-3 text-white border border-gray-800">
                            <div class="flex gap-2">
                                <select id="new-task-project" class="flex-1 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800">
                                    <option value="">Projet : Aucun</option>
                                    ${AppState.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
                                </select>
                                <select id="new-task-duration" class="w-24 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 text-center">
                                    <option value="15">15m</option><option value="30">30m</option><option value="60">1h</option>
                                </select>
                            </div>
                            <div class="flex gap-2">${['Basse','Moyenne','Haute'].map(e=>`<button type="button" onclick="App.selectBankEnergy(this)" class="flex-1 py-2 rounded-xl text-xs font-bold ${e==='Basse'?'energy-btn-selected bg-cyan-500/20 text-cyan-400 border border-cyan-500/50':'bg-[#0D0F12] text-gray-500 border border-transparent'}">${e}</button>`).join('')}</div>
                            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 font-bold uppercase hover:bg-emerald-500 hover:text-black">Ajouter</button>
                        </form>
                    </section>
                    <section>
                        <div class="flex justify-between items-end mb-4 px-1">
                            <h2 class="text-xl font-black text-white">Toutes les tâches</h2>
                            <div class="flex gap-2">
                                <button onclick="App.setBankFilter('all')" class="text-xs px-3 py-1 rounded-full font-bold ${AppState.bankFilter==='all'?'bg-gray-700 text-white':'bg-[#1A1D24] text-gray-500'}">Toutes</button>
                                <button onclick="App.setBankFilter('isolated')" class="text-xs px-3 py-1 rounded-full font-bold ${AppState.bankFilter==='isolated'?'bg-gray-700 text-white':'bg-[#1A1D24] text-gray-500'}">Isolées</button>
                            </div>
                        </div>
                        <div class="space-y-2 pb-10">${filtered.length>0?filtered.map(t=>this.renderTask(t)).join(''):'<p class="text-center text-gray-500 text-sm py-8">Aucune tâche.</p>'}</div>
                    </section>
                </div>`;
            },
            selectBankEnergy(btn){
                const btns=btn.parentElement.querySelectorAll('button');
                btns.forEach(b=>{b.classList.remove('energy-btn-selected','bg-cyan-500/20','text-cyan-400','border-cyan-500/50');b.classList.add('bg-[#0D0F12]','text-gray-500','border-transparent')});
                btn.classList.add('energy-btn-selected','bg-cyan-500/20','text-cyan-400','border-cyan-500/50');
                btn.classList.remove('bg-[#0D0F12]','text-gray-500','border-transparent');
            },
            render(){
                const content=document.getElementById('app-content');
                if(AppState.activeTab==='home')content.innerHTML=this.renderHome();
                else if(AppState.activeTab==='projects')content.innerHTML=this.renderProjects();
                else if(AppState.activeTab==='bank')content.innerHTML=this.renderBank();
                
                const tabs=[{id:'home',color:'text-cyan-400'},{id:'projects',color:'text-cyan-400'},{id:'bank',color:'text-emerald-400'}];
                tabs.forEach(tab=>{
                    const btn=document.getElementById('nav-'+tab.id);
                    if(btn)btn.className=`flex flex-col items-center gap-1 transition-all ${AppState.activeTab===tab.id?tab.color:'text-gray-500'}`;
                });
                lucide.createIcons();
            },
            init(){
                document.getElementById('app-container').insertAdjacentHTML('beforeend', `<nav class="fixed bottom-0 w-full bg-[#13161c]/90 backdrop-blur-md border-t border-gray-800 px-6 py-4 flex justify-between items-center z-20 pb-8"><button onclick="App.setTab('home')" id="nav-home" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="home"></i><span class="text-[10px] font-bold tracking-wider uppercase">Action</span></button><button onclick="App.setTab('projects')" id="nav-projects" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="folder"></i><span class="text-[10px] font-bold tracking-wider uppercase">Projets</span></button><button onclick="App.setTab('bank')" id="nav-bank" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="list-todo"></i><span class="text-[10px] font-bold tracking-wider uppercase">Banque</span></button></nav>`);
                this.render();
            }
        };
        window.onload = () => App.init();
    </script>
</body>
</html>
