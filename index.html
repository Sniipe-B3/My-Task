<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OS de Vie</title>
    
    <!-- Scripts externes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Ton fichier de style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-gray-200 font-sans selection:bg-cyan-500/30">
    <div class="flex justify-center w-full min-h-screen">
        <div class="w-full min-h-screen bg-[#0D0F12] flex flex-col relative overflow-hidden" id="app-container">
            
            <header class="pt-12 pb-4 px-6 bg-gradient-to-b from-[#161a22] to-[#0D0F12] flex items-center justify-between z-10">
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="zap" class="text-cyan-400 fill-cyan-400"></i>
                    OS de Vie
                </h1>
            </header>
            
            <main id="app-content" class="flex-1 overflow-y-auto pb-24 px-4"></main>
            
        </div>
    </div>
    
    <!-- Ton fichier logique -->
    <script src="app.js"></script>
</body>
</html>
