<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OS de Vie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .draggable-item { cursor: grab; transition: transform 0.2s ease, background-color 0.2s ease; }
        .draggable-item:active { cursor: grabbing; }
        .dragging { opacity: 0.4; background: #13161c; transform: scale(1.02); }
        .drag-over { border-top: 2px dashed #06b6d4 !important; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-black text-gray-200 font-sans selection:bg-cyan-500/30">
    <div class="flex justify-center w-full min-h-screen">
        <div class="w-full min-h-screen bg-[#0D0F12] flex flex-col relative overflow-hidden" id="app-container">
            <header class="pt-12 pb-4 px-6 bg-gradient-to-b from-[#161a22] to-[#0D0F12] flex items-center justify-between z-10">
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    <i data-lucide="zap" class="text-cyan-400 fill-cyan-400"></i>
                    OS de Vie
                </h1>
            </header>
            <main id="app-content" class="flex-1 overflow-y-auto pb-24 px-4"></main>
        </div>
    </div>
    
    <script>
        const INITIAL_PROJECTS = [{id:'p1',name:'Poulailler',deadline:'2026-09-01',note:''},{id:'p2',name:'Entretien Peugeot',deadline:'2026-08-20',note:''}];
        const INITIAL_TASKS = [
            {id:'t1',projectId:'p1',name:'Acheter le bois',deadline:'',duration:60,locations:['Boulot'],category:'Business',priority:'Haute',status:'done',subtasks:[],note:''},
            {id:'t2',projectId:'p1',name:'Monter les murs',deadline:'2026-08-15',duration:120,locations:['Jardin', 'Maison'],category:'Famille',priority:'Moyenne',status:'todo',note:'Penser à vérifier le niveau',subtasks:[{id:'s1',name:'Découper planches',duration:30,locations:['Jardin'],category:'Famille',priority:'Haute',status:'todo',note:''},{id:'s2',name:'Visser',duration:45,locations:['Jardin'],category:'Famille',priority:'Basse',status:'todo',note:''}]},
            {id:'t3',projectId:'p2',name:'Prendre rdv garage',deadline:'2026-08-13',duration:15,locations:['Ordi', 'Maison'],category:'Famille',priority:'Haute',status:'todo',subtasks:[],note:''},
            {id:'t4',projectId:null,name:'Appeler le dentiste',deadline:'2026-08-18',duration:15,locations:['Maison', 'Boulot'],category:'',priority:'Basse',status:'todo',subtasks:[],note:''},
            {id:'t5',projectId:null,name:'Déclarer impôts',deadline:'2026-08-14',duration:30,locations:['Ordi'],category:'Business',priority:'Haute',status:'todo',subtasks:[],note:''}
        ];
        
        const migrateTasks = (tasks) => {
            return tasks.map(t => {
                const newTask = { ...t, locations: t.locations || [], category: t.category || '', note: t.note || '' };
                delete newTask.energy;
                if (newTask.subtasks) {
                    newTask.subtasks = newTask.subtasks.map(s => {
                        const newSub = { ...s, locations: s.locations || [], category: s.category || '', note: s.note || '' };
                        delete newSub.energy;
                        return newSub;
                    });
                }
                return newTask;
            });
        };

        const AppState = {
            activeTab:'home',
            settings: JSON.parse(localStorage.getItem('osdevie_settings')) || {
                times: [15, 30, 60, 120],
                locations: ['Maison', 'Boulot', 'Ordi', 'Jardin'],
                categories: ['Business', 'Famille']
            },
            projects:JSON.parse(localStorage.getItem('osdevie_projects'))||INITIAL_PROJECTS,
            tasks: migrateTasks(JSON.parse(localStorage.getItem('osdevie_tasks'))||INITIAL_TASKS),
            homeTime:30,
            homeLocations:[],
            homeSuggestions:[],
            homeSearched:false,
            expandedProjectId:null,
            showAddProject:false,
            bankFilter:'all',
            bankPriorityFilter:'all',
            showProjectAddTaskModal: null,
            showProjectAddSubtaskModal: null,
            activeMenu: null,
            deletePrompt: null,
            editPrompt: null,
            notePrompt: null
        };

        const App = {
            save(){
                localStorage.setItem('osdevie_projects',JSON.stringify(AppState.projects));
                localStorage.setItem('osdevie_tasks',JSON.stringify(AppState.tasks));
                localStorage.setItem('osdevie_settings',JSON.stringify(AppState.settings));
                this.render();
            },
            setTab(tab){AppState.activeTab=tab;this.render();},
            
            // --- SETTINGS LOGIC ---
            addSetting(type, inputId) {
                const input = document.getElementById(inputId);
                let val = input.value.trim();
                if (!val) return;
                
                if (type === 'times') {
                    val = parseInt(val);
                    if (isNaN(val) || val <= 0) return;
                }

                if (!AppState.settings[type].includes(val)) {
                    AppState.settings[type].push(val);
                    if (type === 'times') AppState.settings[type].sort((a,b) => a - b);
                    this.save();
                }
                input.value = '';
            },
            removeSetting(type, val) {
                AppState.settings[type] = AppState.settings[type].filter(item => item !== val);
                if (type === 'times' && AppState.homeTime === val) AppState.homeTime = AppState.settings.times[0] || 0;
                if (type === 'locations') AppState.homeLocations = AppState.homeLocations.filter(l => l !== val);
                this.save();
            },

            openMenu(e, type, id, parentId = null) {
                if (e) { e.preventDefault(); e.stopPropagation(); }
                AppState.activeMenu = { type, id, parentId };
                this.render();
            },
            closeMenu() {
                AppState.activeMenu = null;
                this.render();
            },
            
            openEdit() {
                const { type, id, parentId } = AppState.activeMenu;
                let itemData = {};
                if (type === 'project') itemData = AppState.projects.find(p => p.id === id);
                if (type === 'task') itemData = AppState.tasks.find(t => t.id === id);
                if (type === 'subtask') {
                    const parent = AppState.tasks.find(t => t.id === parentId);
                    itemData = parent.subtasks.find(s => s.id === id);
                }
                AppState.editPrompt = { type, id, parentId, data: JSON.parse(JSON.stringify(itemData)) };
                AppState.activeMenu = null;
                this.render();
            },
            closeEdit() {
                AppState.editPrompt = null;
                this.render();
            },

            // --- NOTE LOGIC ---
            openNote(type, id, parentId = null) {
                let itemData = {};
                if (type === 'project') itemData = AppState.projects.find(p => p.id === id);
                if (type === 'task') itemData = AppState.tasks.find(t => t.id === id);
                if (type === 'subtask') {
                    const parent = AppState.tasks.find(t => t.id === parentId);
                    itemData = parent.subtasks.find(s => s.id === id);
                }
                
                AppState.notePrompt = { type, id, parentId, note: itemData.note || '' };
                AppState.activeMenu = null; // Close menu if open
                this.render();
            },
            closeNote() {
                AppState.notePrompt = null;
                this.render();
            },
            saveNote(event) {
                event.preventDefault();
                const { type, id, parentId } = AppState.notePrompt;
                const noteText = document.getElementById('edit-note-text').value;

                if (type === 'project') {
                    AppState.projects = AppState.projects.map(p => p.id === id ? { ...p, note: noteText } : p);
                } else if (type === 'task') {
                    AppState.tasks = AppState.tasks.map(t => t.id === id ? { ...t, note: noteText } : t);
                } else if (type === 'subtask') {
                    AppState.tasks = AppState.tasks.map(t => {
                        if (t.id === parentId) {
                            return { ...t, subtasks: t.subtasks.map(s => s.id === id ? { ...s, note: noteText } : s) };
                        }
                        return t;
                    });
                }
                AppState.notePrompt = null;
                this.save();
            },

            toggleFormLocation(btn) {
                btn.classList.toggle('loc-selected');
                if (btn.classList.contains('loc-selected')) {
                    btn.classList.remove('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
                    btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');
                } else {
                    btn.classList.add('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
                    btn.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border-emerald-500/50');
                }
            },

            getFormLocations(form) {
                const locBtns = form.querySelectorAll('.loc-selected');
                return Array.from(locBtns).map(b => b.getAttribute('data-loc'));
            },

            saveEdit(event) {
                event.preventDefault();
                const form = event.target;
                const { type, id, parentId } = AppState.editPrompt;
                const name = document.getElementById('edit-name').value;
                
                if (type === 'project') {
                    AppState.projects = AppState.projects.map(p => p.id === id ? { ...p, name } : p);
                } else if (type === 'task') {
                    const projectId = document.getElementById('edit-project').value || null;
                    const duration = parseInt(document.getElementById('edit-duration').value);
                    const category = document.getElementById('edit-category').value;
                    const locations = this.getFormLocations(form);
                    const priorityBtn = form.querySelector('.edit-priority-selected');
                    const priority = priorityBtn ? priorityBtn.innerText.trim() : 'Moyenne';
                    AppState.tasks = AppState.tasks.map(t => t.id === id ? { ...t, name, projectId, duration, locations, category, priority } : t);
                } else if (type === 'subtask') {
                    const duration = parseInt(document.getElementById('edit-sub-duration').value);
                    const category = document.getElementById('edit-sub-category').value;
                    const locations = this.getFormLocations(form);
                    const priorityBtn = form.querySelector('.edit-sub-priority-selected');
                    const priority = priorityBtn ? priorityBtn.innerText.trim() : 'Moyenne';
                    AppState.tasks = AppState.tasks.map(t => {
                        if (t.id === parentId) {
                            return { ...t, subtasks: t.subtasks.map(s => s.id === id ? { ...s, name, duration, locations, category, priority } : s) };
                        }
                        return t;
                    });
                }
                AppState.editPrompt = null;
                this.save();
            },
            selectEditPriority(btn) {
                const btns = btn.parentElement.querySelectorAll('button');
                btns.forEach(b => {
                    b.classList.remove('edit-priority-selected', 'bg-purple-500/20', 'text-purple-400', 'border-purple-500/50');
                    b.classList.add('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
                });
                btn.classList.add('edit-priority-selected', 'bg-purple-500/20', 'text-purple-400', 'border-purple-500/50');
                btn.classList.remove('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
            },
            selectSubEditPriority(btn) {
                const btns = btn.parentElement.querySelectorAll('button');
                btns.forEach(b => {
                    b.classList.remove('edit-sub-priority-selected', 'bg-purple-500/20', 'text-purple-400', 'border-purple-500/50');
                    b.classList.add('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
                });
                btn.classList.add('edit-sub-priority-selected', 'bg-purple-500/20', 'text-purple-400', 'border-purple-500/50');
                btn.classList.remove('bg-[#0D0F12]', 'text-gray-500', 'border-transparent');
            },

            openDelete() {
                AppState.deletePrompt = { ...AppState.activeMenu };
                AppState.activeMenu = null;
                this.render();
            },
            cancelDelete() {
                AppState.deletePrompt = null;
                this.render();
            },
            confirmDelete() {
                const { type, id, parentId } = AppState.deletePrompt;
                if (type === 'project') {
                    AppState.projects = AppState.projects.filter(p => p.id !== id);
                    AppState.tasks = AppState.tasks.filter(t => t.projectId !== id);
                } else if (type === 'task') {
                    AppState.tasks = AppState.tasks.filter(t => t.id !== id);
                } else if (type === 'subtask') {
                    AppState.tasks = AppState.tasks.map(t => {
                        if (t.id === parentId) {
                            return { ...t, subtasks: t.subtasks.filter(s => s.id !== id) };
                        }
                        return t;
                    });
                }
                AppState.deletePrompt = null;
                this.save();
            },
            
            toggleTask(taskId){
                AppState.tasks=AppState.tasks.map(t=>t.id===taskId?{...t,status:t.status==='todo'?'done':'todo'}:t);
                if(AppState.homeSearched)this.generateAction();
                this.save();
            },
            toggleSubtask(taskId,subtaskId){
                AppState.tasks=AppState.tasks.map(t=>{
                    if(t.id===taskId){
                        return{...t,subtasks:t.subtasks.map(s=>s.id===subtaskId?{...s,status:s.status==='todo'?'done':'todo'}:s)}
                    }
                    return t;
                });
                this.save();
            },
            addTask(event){
                event.preventDefault();
                const form = event.target;
                const name = document.getElementById('new-task-name').value;
                const projectId = document.getElementById('new-task-project').value;
                const duration = document.getElementById('new-task-duration').value;
                const category = document.getElementById('new-task-category').value;
                const locations = this.getFormLocations(form);
                const priorityBtn = form.querySelector('.priority-btn-selected');
                const priority = priorityBtn ? priorityBtn.innerText.trim() : 'Moyenne';
                
                if(!name.trim())return;
                AppState.tasks.unshift({id:Date.now().toString(),name,projectId:projectId||null,duration:parseInt(duration),locations,category,priority,deadline:'',status:'todo',subtasks:[],note:''});
                
                document.getElementById('new-task-name').value = '';
                this.save();
            },
            addProjectTask(projectId){
                const input = document.getElementById(`project-quick-task-${projectId}`);
                if(!input) return;
                const name = input.value;
                if(!name.trim())return;
                AppState.tasks.unshift({id:Date.now().toString(),name,projectId:projectId,duration:15,locations:[],category:'',priority:'Moyenne',deadline:'',status:'todo',subtasks:[],note:''});
                AppState.showProjectAddTaskModal = null;
                this.save();
            },
            addSubtask(taskId){
                const input = document.getElementById(`task-quick-subtask-${taskId}`);
                if(!input) return;
                const name = input.value;
                if(!name.trim())return;
                AppState.tasks = AppState.tasks.map(t => {
                    if(t.id === taskId) {
                        return {...t, subtasks: [...(t.subtasks||[]), {id: Date.now().toString(), name, duration: 15, locations: [], category: '', priority: 'Moyenne', status: 'todo', note: ''}]};
                    }
                    return t;
                });
                AppState.showProjectAddSubtaskModal = null;
                this.save();
            },
            addProject(){
                const name=document.getElementById('new-proj-name').value;
                if(!name.trim())return;
                AppState.projects.push({id:Date.now().toString(),name,deadline:'',note:''});
                AppState.showAddProject=false;
                this.save();
            },
            
            setHomeTime(time){AppState.homeTime=time;this.render();},
            toggleHomeLocation(loc){
                if(AppState.homeLocations.includes(loc)){
                    AppState.homeLocations = AppState.homeLocations.filter(l => l !== loc);
                } else {
                    AppState.homeLocations.push(loc);
                }
                this.render();
            },
            
            generateAction(){
                const priorityWeights={'Haute':3,'Moyenne':2,'Basse':1};
                const available=AppState.tasks.filter(t=>{
                    if(t.status==='done') return false;
                    if(t.duration > AppState.homeTime) return false;
                    
                    if(AppState.homeLocations.length > 0) {
                        if (!t.locations || t.locations.length === 0) return false;
                        const match = t.locations.some(l => AppState.homeLocations.includes(l));
                        if(!match) return false;
                    }
                    return true;
                });
                
                AppState.homeSuggestions=available.sort((a,b)=>priorityWeights[b.priority]-priorityWeights[a.priority]).slice(0,3);
                AppState.homeSearched=true;
                this.render();
            },
            toggleProjectExpand(id){AppState.expandedProjectId=AppState.expandedProjectId===id?null:id;this.render();},
            toggleAddProject(){AppState.showAddProject=!AppState.showAddProject;this.render();},
            setBankFilter(filter){AppState.bankFilter=filter;this.render();},
            setBankPriorityFilter(priority){AppState.bankPriorityFilter=priority;this.render();},
            
            handleDragStart(e, id, type, parentId = null) {
                e.dataTransfer.setData('text/plain', JSON.stringify({id, type, parentId}));
                e.currentTarget.classList.add('dragging');
            },
            handleDragEnd(e) {
                e.currentTarget.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            },
            handleDragOver(e) {
                e.preventDefault();
                e.currentTarget.classList.add('drag-over');
            },
            handleDragLeave(e) {
                e.currentTarget.classList.remove('drag-over');
            },
            handleDrop(e, targetId, type, parentId = null) {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                try {
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    if (data.type !== type) return;
                    
                    if (type === 'task') {
                        const oldIndex = AppState.tasks.findIndex(t => t.id === data.id);
                        const newIndex = AppState.tasks.findIndex(t => t.id === targetId);
                        if (oldIndex !== -1 && newIndex !== -1) {
                            const [moved] = AppState.tasks.splice(oldIndex, 1);
                            AppState.tasks.splice(newIndex, 0, moved);
                            this.save();
                        }
                    } else if (type === 'subtask' && data.parentId === parentId) {
                        AppState.tasks = AppState.tasks.map(t => {
                            if (t.id === parentId) {
                                const subs = [...t.subtasks];
                                const oldIndex = subs.findIndex(s => s.id === data.id);
                                const newIndex = subs.findIndex(s => s.id === targetId);
                                if (oldIndex !== -1 && newIndex !== -1) {
                                    const [moved] = subs.splice(oldIndex, 1);
                                    subs.splice(newIndex, 0, moved);
                                }
                                return {...t, subtasks: subs};
                            }
                            return t;
                        });
                        this.save();
                    }
                } catch(err) { console.error(err); }
            },

            renderTask(task, minimal=false){
                const isDone=task.status==='done';
                const priorityColors={'Haute':'text-purple-400 bg-purple-500/10 border-purple-500/30','Moyenne':'text-amber-400 bg-amber-500/10 border-amber-500/30','Basse':'text-blue-400 bg-blue-500/10 border-blue-500/30'};
                const hasLocations = task.locations && task.locations.length > 0;
                
                return `
                <div draggable="true" 
                     ondragstart="App.handleDragStart(event, '${task.id}', 'task')" 
                     ondragend="App.handleDragEnd(event)" 
                     ondragover="App.handleDragOver(event)" 
                     ondragleave="App.handleDragLeave(event)" 
                     ondrop="App.handleDrop(event, '${task.id}', 'task')"
                     class="draggable-item group flex items-center justify-between p-4 rounded-2xl cursor-grab transition-all duration-300 border ${isDone?'bg-[#13161c] border-gray-800/30 opacity-60':'bg-[#1A1D24] border-gray-800 hover:border-gray-700'}">
                    <div class="flex items-center gap-4 overflow-hidden flex-1">
                        <button onclick="App.toggleTask('${task.id}'); event.stopPropagation();" class="shrink-0 focus:outline-none cursor-pointer p-1 -ml-1">
                            ${isDone?'<i data-lucide="check-circle-2" class="text-emerald-500"></i>':'<i data-lucide="circle" class="text-gray-600"></i>'}
                        </button>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold truncate text-[15px] ${isDone?'text-gray-500 line-through':'text-gray-200'}">${task.name}</h4>
                            <div class="flex items-center gap-2 mt-1 text-xs font-semibold text-gray-500 flex-wrap">
                                <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${task.duration}m</span>
                                ${hasLocations ? `<span class="flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3 text-emerald-400"></i> ${task.locations.join(', ')}</span>` : ''}
                                ${task.category ? `<span class="px-1.5 py-0.5 rounded text-[10px] border border-gray-700 bg-gray-800 text-gray-300">${task.category}</span>` : ''}
                                <span class="px-2 py-0.5 rounded-md text-[10px] border font-bold ${priorityColors[task.priority || 'Moyenne']}">${task.priority || 'Moyenne'}</span>
                                ${task.note ? `<span onclick="App.openNote('task', '${task.id}'); event.stopPropagation();" class="flex items-center text-amber-400 hover:text-amber-300 transition-colors bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/30 cursor-pointer" title="Voir la note"><i data-lucide="file-text" class="w-3 h-3"></i></span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0 ml-2">
                        ${minimal ? `
                            <button onclick="event.stopPropagation(); AppState.showProjectAddSubtaskModal = '${task.id}'; App.render();" class="p-2 text-gray-400 hover:text-cyan-400" title="Ajouter une sous-tâche">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        ` : ''}
                        <button onclick="App.openMenu(event, 'task', '${task.id}')" class="p-2 text-gray-500 hover:text-cyan-400 rounded-lg">
                            <i data-lucide="more-vertical" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>`;
            },
            
            renderHome(){
                const now=new Date();
                const urgencies = AppState.tasks.filter(t => {
                    if (t.status === 'done') return false;
                    return true;
                }).sort((a, b) => {
                    const deadlineA = a.deadline ? new Date(a.deadline) : new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
                    const deadlineB = b.deadline ? new Date(b.deadline) : new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
                    const diffA = deadlineA - now;
                    const diffB = deadlineB - now;
                    const scoreA = diffA - (a.duration * 60 * 1000);
                    const scoreB = diffB - (b.duration * 60 * 1000);
                    return scoreA - scoreB;
                }).slice(0, 5);

                const categoryStats = AppState.settings.categories.map(cat => {
                    let total = 0;
                    let done = 0;
                    AppState.tasks.forEach(t => {
                        if (t.category === cat) {
                            total++;
                            if (t.status === 'done') done++;
                        }
                        if (t.subtasks) {
                            t.subtasks.forEach(s => {
                                if (s.category === cat) {
                                    total++;
                                    if (s.status === 'done') done++;
                                }
                            });
                        }
                    });
                    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
                    return { cat, total, done, percent };
                });

                return `
                <div class="space-y-8">
                    <section class="bg-[#1A1D24] rounded-3xl p-5 border border-gray-800/50 relative">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-emerald-500"></div>
                        <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="play" class="text-cyan-400 fill-cyan-400 w-5 h-5"></i> Moteur d'Action</h2>
                        <div class="space-y-4">
                            <div><label class="text-xs font-semibold text-gray-400 uppercase mb-2 block">Temps dispo (min)</label>

                            ${projectTasks.length===0?'<p class="text-sm text-gray-500 text-center py-2">Aucune tâche.</p>':projectTasks.map(task=>`

            renderBank(){
                const filteredTasks = AppState.tasks.filter(t => {
                    if(AppState.bankFilter === 'isolated' && (t.projectId !== null || t.status === 'done')) return false;
                    if(AppState.bankFilter === 'done' && t.status !== 'done') return false;
                    if(AppState.bankFilter === 'all' && t.status === 'done') return false;
                    if(AppState.bankPriorityFilter !== 'all' && t.priority !== AppState.bankPriorityFilter) return false;
                    return true;
                });

                let bankListHtml = '';
                if (filteredTasks.length === 0) {
                    bankListHtml = '<p class="text-center text-gray-500 text-sm py-8">Aucune tâche.</p>';
                } else {
                    filteredTasks.forEach(task => {
                        bankListHtml += `<div class="mb-3">`;
                        bankListHtml += this.renderTask(task, true);
                        
                        if (task.subtasks && task.subtasks.length > 0) {
                            const activeSubs = task.subtasks.filter(s => {
                                if (AppState.bankFilter === 'done') return s.status === 'done';
                                if (AppState.bankPriorityFilter !== 'all' && s.priority !== AppState.bankPriorityFilter) return false;
                                return s.status !== 'done';
                            });
                            if (activeSubs.length > 0) {
                                const priorityColors={'Haute':'text-purple-400 bg-purple-500/10 border-purple-500/30','Moyenne':'text-amber-400 bg-amber-500/10 border-amber-500/30','Basse':'text-blue-400 bg-blue-500/10 border-blue-500/30'};
                                
                                bankListHtml += `<div class="ml-4 mt-2 space-y-2 border-l-2 border-gray-800/50 pl-3">`;
                                activeSubs.forEach(sub => {
                                    const isSubDone = sub.status === 'done';
                                    bankListHtml += `

                                                    ${sub.category ? `<span class="px-1.5 py-0.5 rounded text-[9px] border border-gray-700 bg-gray-800 text-gray-300">${sub.category}</span>` : ''}
                                                    <span class="px-1.5 py-0.2 rounded text-[9px] border ${priorityColors[sub.priority || 'Moyenne']}">${sub.priority || 'Moyenne'}</span>
                                                    ${sub.note ? `<span onclick="App.openNote('subtask', '${sub.id}', '${task.id}'); event.stopPropagation();" class="flex items-center text-amber-400 hover:text-amber-300 transition-colors bg-amber-500/10 px-1.5 py-0.5 rounded border border-amber-500/30 cursor-pointer" title="Voir la note"><i data-lucide="file-text" class="w-3 h-3"></i></span>` : ''}
                                                </div>
                                                <div class="text-[10px] text-cyan-500/70 font-semibold flex items-center gap-1 mt-0.5 truncate">
                                                    <i data-lucide="corner-down-right" class="w-3 h-3 shrink-0"></i> 
                                                    Sous-tâche de : ${task.name}

                                            </div>
                                        </div>
                                        <button onclick="App.openMenu(event, 'subtask', '${sub.id}', '${task.id}')" class="p-2 text-gray-500 hover:text-cyan-400 shrink-0 ml-1 rounded-lg">

                                        </button>

                            }
                        }
                        bankListHtml += `</div>`;
                    });
                }

                return `

                    <section class="bg-gradient-to-br from-[#1A1D24] to-[#13161c] rounded-3xl p-5 border border-gray-800">

                            <input type="text" id="new-task-name" placeholder="Que faut-il faire ?" required class="w-full bg-[#0D0F12] rounded-xl px-4 py-3 text-white border border-gray-800">
                            
                            <div class="flex gap-2">
                                <select id="new-task-project" class="flex-1 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800">

                                ${AppState.settings.categories.map(c=>`<option value="${c}">${c}</option>`).join('')}
                            </select>

                            <div class="flex gap-2 flex-wrap">
                                ${AppState.settings.locations.map(l => `<button type="button" onclick="App.toggleFormLocation(this)" class="flex-1 min-w-[70px] py-2 rounded-xl text-xs font-bold bg-[#0D0F12] text-gray-500 border border-transparent" data-loc="${l}">${l}</button>`).join('')}

                            <div class="flex gap-2">
                                ${['Basse','Moyenne','Haute'].map(p=>`<button type="button" onclick="App.selectBankPriority(this)" class="flex-1 py-2 rounded-xl text-xs font-bold ${p==='Moyenne'?'priority-btn-selected bg-purple-500/20 text-purple-400 border border-purple-500/50':'bg-[#0D0F12] text-gray-500 border border-transparent'}">Priorité : ${p}</button>`).join('')}
                            </div>
                            <button type="submit" class="w-full py-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/50 font-bold uppercase hover:bg-emerald-500 hover:text-black">Ajouter</button>

                    <section>

                                </div>
                            </div>
                            <div class="flex gap-1 items-center overflow-x-auto pb-1">
                                <span class="text-[10px] text-gray-500 uppercase font-bold mr-1">Priorité:</span>

                                <button onclick="App.setBankPriorityFilter('Moyenne')" class="text-[11px] px-2 py-0.5 rounded-md font-bold ${AppState.bankPriorityFilter==='Moyenne'?'bg-amber-500/20 text-amber-400':'bg-[#1A1D24] text-gray-500'}">Moyenne</button>
                                <button onclick="App.setBankPriorityFilter('Basse')" class="text-[11px] px-2 py-0.5 rounded-md font-bold ${AppState.bankPriorityFilter==='Basse'?'bg-blue-500/20 text-blue-400':'bg-[#1A1D24] text-gray-500'}">Basse</button>
                            </div>
                        </div>
                        <div class="pb-10">${bankListHtml}</div>
                    </section>
                </div>`;
            },

            renderSettings(){

                                <div class="flex items-center gap-2 bg-[#0D0F12] border border-gray-800 px-3 py-1.5 rounded-lg text-sm text-gray-300">
                                    <span>${item}</span>
                                    <button onclick="App.removeSetting('${type}', ${isNumber ? item : `'${item}'`})" class="text-gray-500 hover:text-red-500 ml-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                return `
                <div class="space-y-4">
                    <div class="px-1 mb-6">
                        <h2 class="text-xl font-black text-white flex items-center gap-2">
                            <i data-lucide="settings" class="text-gray-400"></i> Paramètres
                        </h2>
                        <p class="text-sm text-gray-500 mt-1">Personnalise les filtres de ton application.</p>
                    </div>
                    ${renderList('times', 'Ex: 45', true)}
                    ${renderList('locations', 'Ex: Garage', false)}
                    ${renderList('categories', 'Ex: Santé', false)}
                </div>
                `;
            },
            
            render(){
                const content=document.getElementById('app-content');
                if(AppState.activeTab==='home')content.innerHTML=this.renderHome();
                else if(AppState.activeTab==='projects')content.innerHTML=this.renderProjects();
                else if(AppState.activeTab==='bank')content.innerHTML=this.renderBank();
                else if(AppState.activeTab==='settings')content.innerHTML=this.renderSettings();
                
                let modalContainer = document.getElementById('modal-container');
                if (!modalContainer) {
                    modalContainer = document.createElement('div');
                    modalContainer.id = 'modal-container';
                    document.getElementById('app-container').appendChild(modalContainer);
                }
                
                if (AppState.activeMenu) {
                    modalContainer.innerHTML = `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center pb-8 px-4" onclick="App.closeMenu()">
                            <div class="bg-[#1A1D24] border border-gray-800 w-full max-w-md rounded-3xl overflow-hidden shadow-2xl transform transition-all animate-slide-up" onclick="event.stopPropagation()">
                                <div class="p-2 border-b border-gray-800/50">
                                    <button onclick="App.openEdit()" class="w-full text-left px-6 py-4 text-white font-bold hover:bg-[#1f232b] flex items-center gap-3">
                                        <i data-lucide="pencil" class="text-cyan-400 w-5 h-5"></i> Modifier
                                    </button>
                                    <button onclick="App.openNote('${AppState.activeMenu.type}', '${AppState.activeMenu.id}', ${AppState.activeMenu.parentId ? `'${AppState.activeMenu.parentId}'` : 'null'})" class="w-full text-left px-6 py-4 text-white font-bold hover:bg-[#1f232b] flex items-center gap-3">
                                        <i data-lucide="file-text" class="text-amber-400 w-5 h-5"></i> Gérer la note
                                    </button>
                                    <button onclick="App.openDelete()" class="w-full text-left px-6 py-4 text-red-500 font-bold hover:bg-[#1f232b] flex items-center gap-3">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i> Supprimer
                                    </button>
                                </div>
                                <div class="p-2">
                                    <button onclick="App.closeMenu()" class="w-full text-center px-6 py-4 text-gray-500 font-bold hover:bg-[#1f232b] rounded-2xl">Annuler</button>
                                </div>
                            </div>
                            </div>
                    `;
                } else if (AppState.notePrompt) {
                    modalContainer.innerHTML = `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center pb-8 px-4" onclick="App.closeNote()">
                            <div class="bg-[#1A1D24] border border-gray-800 w-full max-w-md rounded-3xl p-6 shadow-2xl transform transition-all animate-slide-up" onclick="event.stopPropagation()">
                                <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><i data-lucide="file-text" class="text-amber-400"></i> Note</h3>
                                <form onsubmit="App.saveNote(event)" class="space-y-4">
                                    <textarea id="edit-note-text" rows="6" class="w-full bg-[#0D0F12] rounded-xl px-4 py-3 text-white border border-gray-800 focus:border-amber-500 focus:outline-none placeholder-gray-600" placeholder="Écris ta note ici...">${AppState.notePrompt.note}</textarea>
                                    <div class="flex gap-3 mt-4">
                                        <button type="button" onclick="App.closeNote()" class="flex-1 py-3 rounded-xl bg-[#0D0F12] text-white font-bold border border-gray-700">Annuler</button>
                                        <button type="submit" class="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                } else if (AppState.editPrompt) {
                    const d = AppState.editPrompt.data;
                    const dLocs = d.locations || [];
                    const dCat = d.category || '';
                    
                    modalContainer.innerHTML = `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center pb-8 px-4" onclick="App.closeEdit()">
                            <div class="bg-[#1A1D24] border border-gray-800 w-full max-w-md rounded-3xl p-6 shadow-2xl transform transition-all animate-slide-up" onclick="event.stopPropagation()">
                                <h3 class="text-xl font-bold text-white mb-4">Modifier</h3>
                                <form onsubmit="App.saveEdit(event)" class="space-y-4">
                                    <input type="text" id="edit-name" value="${d.name.replace(/"/g, '&quot;')}" required class="w-full bg-[#0D0F12] rounded-xl px-4 py-3 text-white border border-gray-800 focus:border-cyan-500 focus:outline-none">
                                    
                                    ${AppState.editPrompt.type === 'task' ? `
                                    <div class="flex gap-2">
                                        <select id="edit-project" class="flex-1 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 focus:outline-none">
                                            <option value="">Projet : Aucun</option>
                                            ${AppState.projects.map(p => `<option value="${p.id}" ${p.id === d.projectId ? 'selected' : ''}>${p.name}</option>`).join('')}
                                        </select>
                                        <select id="edit-duration" class="w-24 bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 text-center focus:outline-none">
                                            ${AppState.settings.times.map(t => `<option value="${t}" ${d.duration == t ? 'selected' : ''}>${t}m</option>`).join('')}
                                        </select>
                                    </div>
                                    <select id="edit-category" class="w-full bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 focus:outline-none">
                                        <option value="">Catégorie : Aucune</option>
                                        ${AppState.settings.categories.map(c => `<option value="${c}" ${c === dCat ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                    <div class="flex gap-2 flex-wrap">
                                        ${AppState.settings.locations.map(l => `
                                            <button type="button" onclick="App.toggleFormLocation(this)" data-loc="${l}" class="flex-1 min-w-[70px] py-2 rounded-xl text-xs font-bold ${dLocs.includes(l) ? 'loc-selected bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-[#0D0F12] text-gray-500 border border-transparent'}">${l}</button>
                                        `).join('')}
                                    </div>
                                    <div class="flex gap-2">
                                        ${['Basse','Moyenne','Haute'].map(p => `
                                            <button type="button" onclick="App.selectEditPriority(this)" class="flex-1 py-2 rounded-xl text-xs font-bold ${p === (d.priority || 'Moyenne') ? 'edit-priority-selected bg-purple-500/20 text-purple-400 border border-purple-500/50' : 'bg-[#0D0F12] text-gray-500 border border-transparent'}">${p}</button>
                                        `).join('')}
                                    </div>
                                    ` : ''}

                                    ${AppState.editPrompt.type === 'subtask' ? `
                                    <div class="flex gap-2">
                                        <select id="edit-sub-duration" class="w-full bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 text-center focus:outline-none">
                                            ${AppState.settings.times.map(t => `<option value="${t}" ${(d.duration || 15) == t ? 'selected' : ''}>${t}m</option>`).join('')}
                                        </select>
                                    </div>
                                    <select id="edit-sub-category" class="w-full bg-[#0D0F12] rounded-xl px-3 py-3 text-sm text-gray-300 border border-gray-800 focus:outline-none">
                                        <option value="">Catégorie : Aucune</option>
                                        ${AppState.settings.categories.map(c => `<option value="${c}" ${c === dCat ? 'selected' : ''}>${c}</option>`).join('')}
                                    </select>
                                    <div class="flex gap-2 flex-wrap">
                                        ${AppState.settings.locations.map(l => `
                                            <button type="button" onclick="App.toggleFormLocation(this)" data-loc="${l}" class="flex-1 min-w-[70px] py-2 rounded-xl text-xs font-bold ${dLocs.includes(l) ? 'loc-selected bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 'bg-[#0D0F12] text-gray-500 border border-transparent'}">${l}</button>
                                        `).join('')}
                                    </div>
                                    <div class="flex gap-2">
                                        ${['Basse','Moyenne','Haute'].map(p => `
                                            <button type="button" onclick="App.selectSubEditPriority(this)" class="flex-1 py-2 rounded-xl text-xs font-bold ${p === (d.priority || 'Moyenne') ? 'edit-sub-priority-selected bg-purple-500/20 text-purple-400 border border-purple-500/50' : 'bg-[#0D0F12] text-gray-500 border border-transparent'}">${p}</button>
                                        `).join('')}
                                    </div>
                                    ` : ''}

                                    <div class="flex gap-3 mt-6 pt-2">
                                        <button type="button" onclick="App.closeEdit()" class="flex-1 py-3 rounded-xl bg-[#0D0F12] text-white font-bold border border-gray-700">Annuler</button>
                                        <button type="submit" class="flex-1 py-3 rounded-xl bg-cyan-500 text-black font-bold">Enregistrer</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    `;
                    } else if (AppState.deletePrompt) {
                    let typeName = AppState.deletePrompt.type === 'project' ? 'ce projet' : (AppState.deletePrompt.type === 'task' ? 'cette tâche' : 'cette sous-tâche');
                    modalContainer.innerHTML = `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end justify-center pb-8 px-4" onclick="App.cancelDelete()">
                            <div class="bg-[#1A1D24] border border-gray-800 w-full max-w-md rounded-3xl p-6 shadow-2xl transform transition-all animate-slide-up" onclick="event.stopPropagation()">
                                <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-6"></div>
                                <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                    <i data-lucide="trash-2" class="text-red-500"></i>
                                    Supprimer ${typeName} ?
                                </h3>
                                <p class="text-gray-400 text-sm mb-8">Cette action est définitive et supprimera tout le contenu associé.</p>
                                <div class="flex gap-3">
                                    <button onclick="App.cancelDelete()" class="flex-1 py-4 rounded-xl bg-[#0D0F12] text-white font-bold border border-gray-700">Annuler</button>
                                    <button onclick="App.confirmDelete()" class="flex-1 py-4 rounded-xl bg-red-500/10 text-red-500 font-bold border border-red-500/50">Supprimer</button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    modalContainer.innerHTML = '';
                }
                
                const tabs=[{id:'home',color:'text-cyan-400'},{id:'projects',color:'text-cyan-400'},{id:'bank',color:'text-emerald-400'},{id:'settings',color:'text-gray-200'}];
                tabs.forEach(tab=>{
                    const btn=document.getElementById('nav-'+tab.id);
                    if(btn)btn.className=`flex flex-col items-center gap-1 transition-all ${AppState.activeTab===tab.id?tab.color:'text-gray-500'}`;
                });
                lucide.createIcons();
            },
            
            init(){
                document.getElementById('app-container').insertAdjacentHTML('beforeend', `<nav class="fixed bottom-0 w-full bg-[#13161c]/90 backdrop-blur-md border-t border-gray-800 px-2 py-4 flex justify-around items-center z-20 pb-8"><button onclick="App.setTab('home')" id="nav-home" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="home"></i><span class="text-[10px] font-bold tracking-wider uppercase">Action</span></button><button onclick="App.setTab('projects')" id="nav-projects" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="folder"></i><span class="text-[10px] font-bold tracking-wider uppercase">Projets</span></button><button onclick="App.setTab('bank')" id="nav-bank" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="list-todo"></i><span class="text-[10px] font-bold tracking-wider uppercase">Banque</span></button><button onclick="App.setTab('settings')" id="nav-settings" class="flex flex-col items-center gap-1 transition-all text-gray-500"><i data-lucide="settings"></i><span class="text-[10px] font-bold tracking-wider uppercase">Param</span></button></nav>`);
                this.render();
            }
        };
        window.onload = () => App.init();
    </script>
</body>
</html>
