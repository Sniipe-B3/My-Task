<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Task</title>
    
    <!-- Indique que c'est une App Web -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Paramètres pour forcer le plein écran (Android & iOS) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0D0F12">
    
    <!-- Scripts externes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Ton fichier de style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0D0F12] text-white antialiased font-sans">
    
    <!-- C'est ici que ui.js va injecter toute l'application -->
    <div id="app-container" class="relative min-h-screen w-full max-w-md mx-auto bg-[#0D0F12] overflow-x-hidden pb-20">
        <div id="app-content" class="h-full p-4"></div>
    </div>

    <!-- Tes fichiers logiques séparés -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="app.js"></script>
</body>
    
</html>
