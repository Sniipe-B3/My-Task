<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Task</title>
    
    <!-- Outils de design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- DÉBUGGEUR MOBILE : Affiche les erreurs invisibles directement sur l'écran -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:red; color:white; padding:20px; z-index:9999; word-wrap:break-word; font-family:monospace; font-size: 12px;';
            errDiv.innerHTML = `<b>Erreur Code:</b><br>${msg}<br><br><b>Fichier:</b> ${url}<br><b>Ligne:</b> ${lineNo}`;
            document.body.appendChild(errDiv);
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed; top:0; left:0; width:100%; background:orange; color:black; padding:20px; z-index:9999; word-wrap:break-word; font-family:monospace; font-size: 12px;';
            errDiv.innerHTML = `<b>Erreur Import/Module:</b><br>${event.reason}`;
            document.body.appendChild(errDiv);
        });
    </script>
</head>
<body class="bg-[#0D0F12] text-white antialiased font-sans">
    
    <div id="app-container" class="relative min-h-screen w-full max-w-md mx-auto bg-[#0D0F12] overflow-x-hidden pb-20">
        <div id="app-content" class="h-full p-4 flex flex-col items-center justify-center">
            <div class="text-cyan-500 font-bold uppercase tracking-widest text-sm text-center">
                Lancement du moteur...<br><span class="text-[10px] text-gray-500">Si cet écran reste bloqué sans message d'erreur, c'est que tout fonctionne mais que le rendu est vide.</span>
            </div>
        </div>
    </div>

    <!-- On relance app.js en forçant la version pour esquiver le cache -->
    <script type="module" src="app.js?v=5"></script>
    
</body>
</html>
